name = "wishly-production"
pages_build_output_dir = "./production"
compatibility_date = "2026-10-20"

[vars]
APP_ORIGIN = "https://wishly-production.pages.dev"

# Voie A : les fonctions Pages ne font que proxyfier /api vers le worker
# wishly-production-api (service binding API, configure dans Settings > Functions).
# La D1 wishly-production-db reste liee au worker, pas au projet Pages :
# aucune binding D1 ici, sinon le deploiement Pages echoue (Error 8000022).
# Configure SESSION_PEPPER avec : npx wrangler pages secret put SESSION_PEPPER --project-name wishly-production
