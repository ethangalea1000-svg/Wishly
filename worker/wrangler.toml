name = "wishly-production-api"
main = "src/index.ts"
compatibility_date = "2026-10-20"
workers_dev = true

[vars]
APP_ORIGIN = "https://wishly-production.pages.dev"

[[d1_databases]]
binding = "DB"
database_name = "wishly-production-db"
database_id = "3287b8ce-2e1d-4ce0-865d-77706ba49388"
migrations_dir = "migrations"

# D1 dediee production, deja creee et liee au worker (dashboard).
# Ne jamais pointer ce binding vers wishly-demo-db ou une base contenant de vraies donnees.
# APP_ORIGIN = origine exacte du frontend Pages (deja en place cote worker).
# Configure SESSION_PEPPER avec : npx wrangler secret put SESSION_PEPPER
