name: Worker and browser checks

on:
  push:
    branches: [main, production-foundation]
    paths:
      - "worker/**"
      - "production/**"
      - "wishly-app/**"
      - "tests/**"
      - "playwright.config.cjs"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "worker/**"
      - "production/**"
      - "wishly-app/**"
      - "tests/**"
      - "playwright.config.cjs"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: wishly-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-tests:
    name: API typecheck, tests and migration checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: node --check ../production/app.js
      - run: node --check ../production/shared.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python test/migration_check.py

  browser-e2e:
    name: Browser end-to-end tests (isolated mocked API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: npm install --no-save @playwright/test
      - run: npx playwright install --with-deps chromium
      - name: Run browser tests
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wishly-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
