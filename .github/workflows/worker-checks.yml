name: Worker and browser checks

on:
  push:
    branches: [main, production-foundation]
    paths:
      - "worker/**"
      - "production/**"
      - "wishly-app/**"
      - "tests/**"
      - "playwright.config.cjs"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "worker/**"
      - "production/**"
      - "wishly-app/**"
      - "tests/**"
      - "playwright.config.cjs"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  # Validate the newest commit instead of queueing behind stale or stalled runs.
  group: wishly-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker-tests:
    name: API typecheck, tests and migration checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: node --check ../production/app.js
      - run: node --check ../production/shared.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python test/migration_check.py

  browser-e2e:
    name: Browser end-to-end tests (isolated mocked API)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: npm install --no-save @playwright/test
      - run: npx playwright install chromium
      - name: Run browser tests
        run: npx playwright test
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wishly-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  local-d1-integration:
    name: Real API integration against isolated local D1
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Apply migrations to isolated local D1
        run: npx wrangler d1 migrations apply wishly-production-db --local
      - name: Start Worker against local D1
        run: |
          npx wrangler dev --local --ip 127.0.0.1 --port 8787 --var APP_ORIGIN:http://localhost:8787 --var SESSION_PEPPER:local-integration-secret-which-is-long-enough > /tmp/wishly-local-worker.log 2>&1 &
          echo $! > /tmp/wishly-local-worker.pid
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8787/api/health > /dev/null; then
              echo "Local Worker is healthy."
              exit 0
            fi
            sleep 2
          done
          cat /tmp/wishly-local-worker.log
          exit 1
      - name: Exercise real registration, wishlist, sharing and guest reservation flows
        run: node test/integration-local.mjs
      - name: Show Worker logs if integration fails
        if: failure()
        run: cat /tmp/wishly-local-worker.log

  live-api-smoke:
    name: Production API health and CORS smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Verify public health endpoint from the published site origin
        shell: bash
        run: |
          set -euo pipefail
          origin="https://ethangalea1000-svg.github.io"
          api="https://wishly-production-api.ethan-galea1000.workers.dev"
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error --connect-timeout 10 --max-time 25 -H "Origin: ${origin}" -D "${headers}" -o "${body}" -w "%{http_code}" "${api}/api/health")"
          echo "Health endpoint HTTP status: ${status}"
          cat "${body}"
          test "${status}" = "200"
          grep -iq "^access-control-allow-origin: ${origin}" "${headers}"
          grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' "${body}"
      - name: Verify browser preflight for authenticated API requests
        shell: bash
        run: |
          set -euo pipefail
          origin="https://ethangalea1000-svg.github.io"
          api="https://wishly-production-api.ethan-galea1000.workers.dev"
          headers="$(mktemp)"
          status="$(curl --silent --show-error --connect-timeout 10 --max-time 25 -X OPTIONS -D "${headers}" -o /dev/null -w "%{http_code}" \
            -H "Origin: ${origin}" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: authorization,content-type" \
            "${api}/api/auth/login")"
          echo "CORS preflight HTTP status: ${status}"
          test "${status}" = "204"
          grep -iq "^access-control-allow-origin: ${origin}" "${headers}"
          grep -iq "^access-control-allow-credentials: true" "${headers}"
          grep -iq "^access-control-allow-methods:.*POST" "${headers}"
          grep -iq "^access-control-allow-headers:.*authorization" "${headers}"
